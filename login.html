<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة صالون التجميل</title>
    
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    
    <style>
        /* CSS-Only Modal */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .custom-modal:target {
            display: flex;
        }
        .modal-content {
            background: var(--bg-surface);
            padding: 3rem 2rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--color-accent);
            text-align: center;
            min-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(214, 168, 95, 0.2);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 15px var(--color-accent); }
            100% { transform: scale(1); }
        }
        .modal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--color-accent);
        }
        .modal-title {
            font-size: 1.5rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }
        .modal-message {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    صالون <span>التجميل</span>
                </div>
                <h1 style="font-size: 1.5rem; color: var(--color-primary); margin-bottom: 0.5rem;">مرحبًا بك</h1>
                <p class="login-subtitle">يرجى تسجيل الدخول للوصول إلى لوحة التحكم</p>
            </div>
            
            <form action="index.html">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-control" placeholder="أدخل البريد الإلكتروني" required>
                </div>
                
                <div class="form-group mb-4">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                </div>
                
                <div class="login-options">
                    <label class="checkbox-label">
                        <input type="checkbox">
                        تذكرني
                    </label>
                    
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>
                
                <a href="#custom-alert" class="btn btn-accent" style="width: 100%; padding: 0.8rem; font-size: 1rem; text-align: center; display: block; text-decoration: none;">
                    تسجيل الدخول
                </a>
            </form>
        </div>
    </div>

    
    <div id="custom-alert" class="custom-modal">
        <div class="modal-content">
            <div class="modal-icon">🐐</div>
            <h2 class="modal-title">رسالة إدارية</h2>
            <p class="modal-message font-bold" style="color: var(--color-accent);">كريستيانو عمك</p>
            <div style="display: flex; gap: 1rem;">
                <a href="#" class="btn btn-outline" style="flex: 1; text-decoration: none; justify-content: center;">إلغاء</a>
                <a href="index.html" class="btn btn-accent" style="flex: 1; text-decoration: none; justify-content: center;">دخول للوحة التحكم</a>
            </div>
        </div>
    </div>
</body>
</html>
