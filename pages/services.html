<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات - نظام إدارة صالون التجميل</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">صالون <span>التجميل</span></div>
            </div>
            
            <nav class="sidebar-menu">
                <a href="../index.html" class="menu-item">لوحة التحكم</a>
                <a href="appointments.html" class="menu-item">المواعيد</a>
                <a href="services.html" class="menu-item active">الخدمات</a>
            </nav>
        </aside>

        
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <input type="text" placeholder="ابحث...">
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div class="page-title">
                        <h1>إدارة الخدمات</h1>
                        <p>إدارة خدمات الصالون، الفئات، والأسعار</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-accent">إضافة خدمة</button>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button class="btn btn-primary" style="flex: 1;">الكل</button>
                        <button class="btn btn-outline" style="flex: 1;">خدمات الشعر</button>
                        <button class="btn btn-outline" style="flex: 1;">خدمات البشرة</button>
                        <button class="btn btn-outline" style="flex: 1;">المكياج والتجميل</button>
                    </div>
                </div>

                <div class="services-grid">
                    <div class="service-card">
                        <div class="service-header">
                            <div>
                                <h3 class="service-title">قص شعر + استشوار</h3>
                                <div class="service-category">خدمات الشعر</div>
                            </div>
                            <span class="badge badge-success">نشطة</span>
                        </div>
                        <div class="service-price">150 ريال يمني</div>
                        <div class="service-meta">
                            <div style="display: flex; align-items: center; gap: 0.3rem;">60 دقيقة</div>
                            <div style="display: flex; align-items: center; gap: 0.3rem;">امل</div>
                        </div>
                    </div>

                    <div class="service-card">
                        <div class="service-header">
                            <div>
                                <h3 class="service-title">تنظيف بشرة عميق</h3>
                                <div class="service-category">خدمات البشرة</div>
                            </div>
                            <span class="badge badge-success">نشطة</span>
                        </div>
                        <div class="service-price">350 ريال يمني</div>
                        <div class="service-meta">
                            <div style="display: flex; align-items: center; gap: 0.3rem;">90 دقيقة</div>
                            <div style="display: flex; align-items: center; gap: 0.3rem;">منى</div>
                        </div>
                    </div>

                    <div class="service-card">
                        <div class="service-header">
                            <div>
                                <h3 class="service-title">مكياج سهرة</h3>
                                <div class="service-category">المكياج والتجميل</div>
                            </div>
                            <span class="badge badge-success">نشطة</span>
                        </div>
                        <div class="service-price">250 ريال يمني</div>
                        <div class="service-meta">
                            <div style="display: flex; align-items: center; gap: 0.3rem;">60 دقيقة</div>
                            <div style="display: flex; align-items: center; gap: 0.3rem;">ريم</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
