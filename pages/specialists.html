<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأخصائيون - نظام إدارة صالون التجميل</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">صالون <span>التجميل</span></div>
            </div>
            
            <nav class="sidebar-menu">
                <a href="../index.html" class="menu-item">لوحة التحكم</a>
                <a href="appointments.html" class="menu-item">المواعيد</a>
                <a href="specialists.html" class="menu-item active">الأخصائيون</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <input type="text" placeholder="ابحث...">
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div class="page-title">
                        <h1>الأخصائيون</h1>
                        <p>إدارة فريق العمل، تقييماتهم، وجداولهم</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-accent">إضافة أخصائية</button>
                    </div>
                </div>

                <div class="specialists-grid">
                    <div class="specialist-card">
                        <div class="specialist-image">ا</div>
                        <h3 class="specialist-name">امل</h3>
                        <div class="specialist-title">أخصائية شعر</div>
                        <span class="badge badge-success mb-3">متاحة</span>
                    </div>

                    <div class="specialist-card">
                        <div class="specialist-image">م</div>
                        <h3 class="specialist-name">منى صالح</h3>
                        <div class="specialist-title">أخصائية بشرة</div>
                        <span class="badge badge-warning mb-3">مشغولة</span>
                    </div>

                    <div class="specialist-card">
                        <div class="specialist-image">ر</div>
                        <h3 class="specialist-name">ريم فهد</h3>
                        <div class="specialist-title">خبيرة تجميل ومكياج</div>
                        <span class="badge badge-danger mb-3">غير متاحة</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
